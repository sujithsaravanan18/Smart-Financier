{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-5">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">{{ _('Forgot Password') }}</h2>
                <p class="text-muted text-center">{{ _('Enter your email address and we'll send you a link to reset your password.') }}</p>
                <form action="" method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label for="email" class="form-label">{{ _('Email address') }}</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">{{ _('Send Reset Link') }}</button>
                    
                    <div class="mt-3 text-center">
                        <a href="{{ url_for('auth.login') }}">{{ _('Back to Login') }}</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
