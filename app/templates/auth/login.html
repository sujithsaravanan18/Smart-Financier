{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-5">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">{{ _('Sign In') }}</h2>
                <form action="" method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label for="username" class="form-label">{{ _('Username') }}</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">{{ _('Password') }}</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me">
                        <label class="form-check-label" for="remember_me">{{ _('Remember Me') }}</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">{{ _('Sign In') }}</button>
                    
                    <div class="mt-3 text-center">
                        <a href="{{ url_for('auth.forgot_password') }}">{{ _('Forgot Password?') }}</a>
                    </div>
                    <div class="mt-2 text-center">
                        <a href="{{ url_for('auth.register') }}">{{ _("Don't have an account? Sign up") }}</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
