{% extends "base.html" %}

{% block content %}
<div class="row">
    <!-- Sidebar -->
    <div class="col-md-3">
        <div class="list-group">
            <a href="{{ url_for('dashboard.admin_dashboard') }}" class="list-group-item list-group-item-action {% if request.endpoint == 'dashboard.admin_dashboard' %}active{% endif %}">{{ _('Dashboard') }}</a>
            <a href="{{ url_for('admin.users') }}" class="list-group-item list-group-item-action {% if request.endpoint == 'admin.users' %}active{% endif %}">{{ _('User Management') }}</a>
            <a href="{{ url_for('loans.admin_overview') }}" class="list-group-item list-group-item-action {% if request.endpoint == 'loans.admin_overview' %}active{% endif %}">{{ _('Loans & Payments') }}</a>
            <a href="{{ url_for('logs.index') }}" class="list-group-item list-group-item-action {% if request.endpoint == 'logs.index' %}active{% endif %}">{{ _('System Logs') }}</a>
            <a href="{{ url_for('settings.admin_settings') }}" class="list-group-item list-group-item-action {% if request.endpoint == 'settings.admin_settings' %}active{% endif %}">{{ _('Global Settings') }}</a>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="col-md-9">
        {% block admin_content %}{% endblock %}
    </div>
</div>
{% endblock %}
